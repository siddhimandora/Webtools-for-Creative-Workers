<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orbit Tool</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 30px 15px 30px;
      background-color: #f3f3f3;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .description {
      margin: 5px 0 0 0;
      color: #666;
      font-size: 15px;
    }

    /* HORIZONTAL TOOLBAR */

    .controls {
      display: flex;
      align-items: center;
      gap: 30px;

      padding: 15px 30px;

      background-color: white;

      border-top: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .slider-group label {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
    }

    input[type="number"] {
      width: 75px;
      height: 34px;

      border: 1px solid #bbb;

      padding: 5px;

      font-size: 14px;
    }

    button {
      height: 38px;
      padding: 0 25px;

      border: none;

      background-color: black;
      color: white;

      cursor: pointer;

      white-space: nowrap;
    }

    button:hover {
      background-color: #444;
    }

    /* CANVAS AREA */

    #canvas-container {
      flex: 1;

      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      background-color: #323232;

      overflow: hidden;
    }

    canvas {
      display: block;
    }

  </style>
</head>


<body>

  <header>

    <h1>Orbit Tool</h1>

    <p class="description">
      Move through the 3D space using the sliders or enter a value manually.
    </p>

  </header>



  <!-- HORIZONTAL CONTROLS -->

  <div class="controls">


    <!-- X -->

    <div class="slider-group">

      <label for="xSlider">X</label>

      <div class="slider-row">

        <input
          id="xSlider"
          type="range"
          min="-1000"
          max="1000"
          value="0"
        >

        <input
          id="xNumber"
          type="number"
          min="-1000"
          max="1000"
          value="0"
        >

      </div>

    </div>



    <!-- Y -->

    <div class="slider-group">

      <label for="ySlider">Y</label>

      <div class="slider-row">

        <input
          id="ySlider"
          type="range"
          min="-1000"
          max="1000"
          value="0"
        >

        <input
          id="yNumber"
          type="number"
          min="-1000"
          max="1000"
          value="0"
        >

      </div>

    </div>



    <!-- Z -->

    <div class="slider-group">

      <label for="zSlider">Z</label>

      <div class="slider-row">

        <input
          id="zSlider"
          type="range"
          min="-1500"
          max="1500"
          value="500"
        >

        <input
          id="zNumber"
          type="number"
          min="-1500"
          max="1500"
          value="500"
        >

      </div>

    </div>



    <button id="saveButton">
      Save Image
    </button>

  </div>



  <!-- FULL VIEWER -->

  <div id="canvas-container"></div>



  <script>

    let cam;

    let xSlider;
    let ySlider;
    let zSlider;

    let xNumber;
    let yNumber;
    let zNumber;



    function setup() {

      let container =
        document.getElementById("canvas-container");


      let canvas = createCanvas(
        container.clientWidth,
        container.clientHeight,
        WEBGL
      );


      canvas.parent("canvas-container");


      cam = createCamera();



      xSlider =
        document.getElementById("xSlider");

      ySlider =
        document.getElementById("ySlider");

      zSlider =
        document.getElementById("zSlider");



      xNumber =
        document.getElementById("xNumber");

      yNumber =
        document.getElementById("yNumber");

      zNumber =
        document.getElementById("zNumber");



      /* X */

      xSlider.addEventListener(
        "input",
        function () {

          xNumber.value =
            xSlider.value;

        }
      );


      xNumber.addEventListener(
        "input",
        function () {

          xSlider.value =
            xNumber.value;

        }
      );



      /* Y */

      ySlider.addEventListener(
        "input",
        function () {

          yNumber.value =
            ySlider.value;

        }
      );


      yNumber.addEventListener(
        "input",
        function () {

          ySlider.value =
            yNumber.value;

        }
      );



      /* Z */

      zSlider.addEventListener(
        "input",
        function () {

          zNumber.value =
            zSlider.value;

        }
      );


      zNumber.addEventListener(
        "input",
        function () {

          zSlider.value =
            zNumber.value;

        }
      );



      /* SAVE */

      document
        .getElementById("saveButton")
        .addEventListener(
          "click",
          function () {

            saveCanvas(
              "orbit-world",
              "png"
            );

          }
        );

    }



    function draw() {

      background(50);


      let radius = 1000;



      let x =
        Number(xSlider.value);

      let y =
        Number(ySlider.value);

      let z =
        Number(zSlider.value);



      cam.setPosition(
        x,
        y,
        z
      );


      cam.lookAt(
        0,
        0,
        0
      );


      normalMaterial();



      for (
        let i = 0;
        i <= 12;
        i++
      ) {

        for (
          let j = 0;
          j <= 12;
          j++
        ) {

          push();


          let a =
            (j / 12) * PI;

          let b =
            (i / 12) * PI;



          translate(

            sin(2 * a)
            * radius
            * sin(b),

            (cos(b)
            * radius) / 2,

            cos(2 * a)
            * radius
            * sin(b)

          );



          if (
            j % 2 === 0
          ) {

            cone(
              30,
              30
            );

          }

          else {

            box(
              30,
              30,
              30
            );

          }



          pop();

        }

      }

    }



    /* RESIZE CANVAS WITH WINDOW */

    function windowResized() {

      let container =
        document.getElementById("canvas-container");


      resizeCanvas(
        container.clientWidth,
        container.clientHeight
      );

    }

  </script>

</body>

</html>
